<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — VHOST</title>
<meta name="description" content="Inscrivez-vous sur VHOST et hébergez votre bot Discord ou serveur Minecraft en quelques minutes.">
<meta name="keywords" content="hébergement bot discord, serveur minecraft, hosting discord, vhoste">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Créer un compte — VHOST">
<meta property="og:description" content="Inscrivez-vous sur VHOST et hébergez votre bot Discord ou serveur Minecraft en quelques minutes.">
<meta property="og:url" content="https://vhoste.cloud">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><img src="/assets/logo.svg" width="56" height="56" alt="VHOST" style="border-radius:14px;display:block;margin:0 auto;"></div>
    <h1>Créer un compte</h1>
    <p class="sub">Choisis un nom d'utilisateur et un mot de passe, puis renseigne ton identifiant d'achat pour activer ton espace.</p>
    <div class="auth-error" id="error"></div>

    <form id="signup-form">
      <div class="field">
        <label>Que veux-tu héberger ?</label>
        <div class="service-picker">
          <label class="service-option">
            <input type="radio" name="service" value="discord" checked>
            <span>🤖 Bot Discord<br><small>Modmail / tickets</small></span>
          </label>
          <label class="service-option">
            <input type="radio" name="service" value="minecraft">
            <span>⛏️ Serveur Minecraft<br><small>Paper, plugins, fichiers</small></span>
          </label>
        </div>
      </div>
      <div class="field">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="ex: mishima" required autocomplete="username" minlength="3" maxlength="32">
      </div>
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="ex: toi@exemple.com" required autocomplete="email" maxlength="191">
        <p class="field-hint">Sert à te connecter ensuite.</p>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="6 caractères minimum" required autocomplete="new-password" minlength="6">
      </div>
      <div class="field">
        <label for="password2">Confirme le mot de passe</label>
        <input type="password" id="password2" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>
      <div class="field">
        <label for="code">Identifiant d'achat</label>
        <input type="text" id="code" class="mono" placeholder="TCKT-XXXX-XXXX-XXXX" required autocomplete="off">
        <p class="field-hint">Le code reçu à l'achat. Pas encore de compte ? <a href="/accueil">Voir les offres</a>.</p>
      </div>
      <button type="submit" class="btn-primary" style="width:100%">Créer mon compte</button>
    </form>
    <p class="sub" style="margin-top:16px;">Déjà un compte ? <a href="/login">Se connecter</a></p>
  </div>
</div>
<script>
const form = document.getElementById('signup-form');
const prefill = new URLSearchParams(location.search).get('code');
if (prefill) document.getElementById('code').value = prefill;
const errorBox = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');

  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const code = document.getElementById('code').value.trim();
  const service = document.querySelector('input[name="service"]:checked')?.value || 'discord';

  if (password !== password2) {
    errorBox.textContent = 'Les mots de passe ne correspondent pas.';
    errorBox.classList.add('show');
    return;
  }

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, code, service }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorBox.textContent = data.error || 'Erreur inconnue.';
      errorBox.classList.add('show');
      return;
    }
    window.location.href = '/dashboard';
  } catch {
    errorBox.textContent = 'Connexion au serveur impossible, réessaie.';
    errorBox.classList.add('show');
  }
});
</script>
</body>
</html>
