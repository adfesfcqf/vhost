<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — VHOST</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#dde0f0;font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:560px}
.badge{display:inline-block;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#f59e0b;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
h1{font-size:28px;font-weight:800;margin-bottom:8px}
p{font-size:13px;color:rgba(200,205,230,.5);margin-bottom:32px;line-height:1.6}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.card{background:#0e0e1a;border:1.5px solid rgba(255,255,255,.06);border-radius:14px;padding:24px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:rgba(99,102,241,.4);background:#13131f;transform:translateY(-2px)}
.card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.card-icon.discord{background:rgba(99,102,241,.1)}
.card-icon.minecraft{background:rgba(34,211,238,.1)}
.card-title{font-size:16px;font-weight:700;margin-bottom:4px}
.card-sub{font-size:12px;color:rgba(200,205,230,.4);line-height:1.5}
.back{text-align:center}
.back a{font-size:12px;color:rgba(200,205,230,.3);text-decoration:none}
.back a:hover{color:rgba(200,205,230,.6)}
</style>
</head>
<body>
<div class="container">
  <span class="badge">Mode Demo</span>
  <h1>Choisis un service</h1>
  <p>Explore le dashboard VHOST en mode lecture seule.<br>Aucun compte requis.</p>
  <div class="cards">
    <a href="/demo/discord" class="card">
      <div class="card-icon discord">
        <svg width="24" height="24" fill="#6366f1" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/></svg>
      </div>
      <div class="card-title">Bot Discord</div>
      <div class="card-sub">Tickets, musique, moderation, statistiques et plus encore.</div>
    </a>
    <a href="/demo/minecraft" class="card">
      <div class="card-icon minecraft">
        <svg width="24" height="24" fill="none" stroke="#22d3ee" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </div>
      <div class="card-title">Serveur Minecraft</div>
      <div class="card-sub">Console, joueurs, fichiers, mods et gestion complete.</div>
    </a>
  </div>
  <div class="back"><a href="/">Retour a l accueil</a></div>
</div>
</body>
</html>
